<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#030b09">
  <meta name="description" content="PAR ORDO — премиальная баня и отдых в Бишкеке. AZA DIGITAL ECOSYSTEM.">
  <meta name="application-name" content="PAR ORDO">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="PAR ORDO">
  <title>PAR ORDO | FUTURE ARENA</title>
  <link rel="icon" href="./par-ordo-logo.png" type="image/png">
  <link rel="apple-touch-icon" href="./icon-192.png">
  <link rel="manifest" href="./manifest.json">
  <link rel="stylesheet" href="./par-ordo-future-arena-v122.css?v=122">
</head>
<body>
  <div id="app"><div class="loading-screen">PAR ORDO <span>FUTURE ARENA</span></div></div>
  <script src="./app.js?v=future-arena-1" defer></script>
  <script>
    let deferredInstallPrompt = null;
    window.addEventListener("beforeinstallprompt", event => {
      event.preventDefault();
      deferredInstallPrompt = event;
      window.__parOrdoInstallAvailable = true;
      document.dispatchEvent(new Event("parordo:installavailable"));
    });
    document.addEventListener("click", async event => {
      const installButton = event.target.closest("[data-install-app]");
      if (!installButton) return;
      if (!deferredInstallPrompt) return;
      deferredInstallPrompt.prompt();
      await deferredInstallPrompt.userChoice;
      deferredInstallPrompt = null;
      window.__parOrdoInstallAvailable = false;
      installButton.hidden = true;
    });
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("./service-worker.js").catch(error => console.warn("Service worker:", error));
      });
    }
  </script>
</body>
</html>
